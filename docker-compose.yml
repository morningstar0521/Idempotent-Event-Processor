services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d events']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      CMD: api
      NODE_ENV: development
      API_KEY: ${API_KEY:-change-me}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/events}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3000:3000'
    restart: unless-stopped

  relay:
    build: .
    environment:
      CMD: relay
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/events}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      METRICS_PORT: ${METRICS_PORT:-9102}
      RELAY_POLL_MS: ${RELAY_POLL_MS:-100}
      SWEEP_INTERVAL_MS: ${SWEEP_INTERVAL_MS:-30000}
      SWEEP_STALE_MS: ${SWEEP_STALE_MS:-120000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    environment:
      CMD: worker
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/events}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      METRICS_PORT: 9101
      LOCK_TTL_MS: ${LOCK_TTL_MS:-30000}
      VISIBILITY_TIMEOUT_MS: ${VISIBILITY_TIMEOUT_MS:-30000}
      BACKOFF_BASE_MS: ${BACKOFF_BASE_MS:-500}
      BACKOFF_CAP_MS: ${BACKOFF_CAP_MS:-30000}
      SWEEP_INTERVAL_MS: ${SWEEP_INTERVAL_MS:-30000}
      SWEEP_STALE_MS: ${SWEEP_STALE_MS:-120000}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-5}
      MAX_DELIVERIES: ${MAX_DELIVERIES:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

