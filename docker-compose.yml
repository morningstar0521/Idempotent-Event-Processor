services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d events']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    entrypoint: ['node', 'dist/bin/migrate.js']
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/events
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      CMD: api
      NODE_ENV: development
      API_KEY: ${API_KEY:-change-me}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/events}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '3000:3000'
    restart: unless-stopped

  relay:
    build: .
    environment:
      CMD: relay
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/events}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      METRICS_PORT: ${METRICS_PORT:-9102}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    environment:
      CMD: worker
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/events}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      METRICS_PORT: 9101
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

